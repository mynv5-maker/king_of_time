<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bấm giờ task</title>
<style>
:root{
  --bg:#E9EEF2; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#15202B; --muted:#5A6877; --line:#D2DAE2;
  --run:#0E7468; --run-soft:#D6EFEA; --ot:#5A3EA4; --ot-soft:#E8E2F7;
  --warn:#9A5604; --warn-soft:#FBEBD2; --danger:#B42318; --danger-soft:#FBE1DD;
  --focus:#1D5FD6; --idle:#8C99A6; --shadow:0 1px 2px rgba(21,32,43,.06),0 6px 24px rgba(21,32,43,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11171D; --surface:#19212A; --surface-2:#1F2933; --ink:#E6EDF3; --muted:#9AA8B6; --line:#2E3A46;
    --run:#3CC2AE; --run-soft:#173A36; --ot:#A991F0; --ot-soft:#2C2545;
    --warn:#F0B45A; --warn-soft:#3A2C14; --danger:#F07A6C; --danger-soft:#3F1E1A;
    --focus:#6EA0FF; --idle:#6B7886; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11171D; --surface:#19212A; --surface-2:#1F2933; --ink:#E6EDF3; --muted:#9AA8B6; --line:#2E3A46;
  --run:#3CC2AE; --run-soft:#173A36; --ot:#A991F0; --ot-soft:#2C2545;
  --warn:#F0B45A; --warn-soft:#3A2C14; --danger:#F07A6C; --danger-soft:#3F1E1A;
  --focus:#6EA0FF; --idle:#6B7886; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"Segoe UI","Yu Gothic UI","Meiryo UI","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;text-align:center}
.btn:hover{border-color:var(--muted)}
.btn.big{min-height:58px;font-size:17px;padding:0 22px}
.btn.primary{background:var(--run);border-color:var(--run);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger-ghost{color:var(--danger);border-color:var(--danger-soft)}
.btn.ot{background:var(--ot);border-color:var(--ot);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--focus);text-decoration:underline;cursor:pointer;font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:10px 20px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--surface)}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:15px}
.tabs{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.tabs button{border:0;background:transparent;min-height:38px;padding:0 16px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.top .spacer{flex:1}
.clock{display:flex;align-items:baseline;gap:6px;font-weight:700;font-size:20px}
.clock small{font-size:12px;color:var(--muted);font-weight:600}
.me{display:flex;align-items:center;gap:10px}
.me-name{font-weight:600}

/* banners */
#banners{display:flex;flex-direction:column;gap:8px;padding:12px 20px 0;max-width:1400px;margin:0 auto}
#banners:empty{display:none}
.banner{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--ink);border-left:6px solid var(--warn);flex-wrap:wrap}
.banner.ot{background:var(--ot-soft);border-color:var(--ot)}
.banner.danger{background:var(--danger-soft);border-color:var(--danger)}
.banner.info{background:var(--surface);border-color:var(--idle)}
.banner p{margin:0;flex:1;min-width:220px}

/* layout */
.wrap{max-width:1400px;margin:0 auto;padding:16px 20px 60px}
.main-grid{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){.main-grid{grid-template-columns:1fr}}
.main-grid > *{min-width:0}
.left-col{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
@media (max-width:900px){.left-col{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:10px}
.panel h3 .hint{font-weight:400;color:var(--muted);font-size:13px}

/* running card */
.run{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 20px 18px 28px;box-shadow:var(--shadow);overflow:hidden}
.run::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--idle)}
.run.is-running::before{background:var(--run)}
.run.is-ot::before{background:var(--ot)}
.run-state{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--idle)}
.is-running .dot{background:var(--run);animation:pulse 1.6s ease-in-out infinite}
.is-ot .dot{background:var(--ot)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.is-running .dot{animation:none}}
.tag{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.tag.ot{background:var(--ot);color:#fff}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.danger{background:var(--danger-soft);color:var(--danger)}
.tag.ok{background:var(--run-soft);color:var(--run)}
.run-task{margin:10px 0 2px;font-size:21px;line-height:1.3;font-weight:700;word-break:break-word}
.run-path{color:var(--muted);font-size:13px}
.run-time{font-size:68px;font-weight:700;line-height:1;letter-spacing:-2px;margin:14px 0 6px}
.run-time small{font-size:28px;letter-spacing:0;color:var(--muted);margin-left:2px}
.is-running .run-time{color:var(--run)}
.is-ot .run-time{color:var(--ot)}
.run-meta{color:var(--muted);font-size:14px;display:flex;gap:14px;flex-wrap:wrap}
.run-empty{font-size:17px;margin:10px 0 4px;font-weight:600}
.fields{display:grid;grid-template-columns:120px 1fr;gap:10px;margin-top:16px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{min-width:0;width:100%;min-height:42px;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;font-size:15px;font-weight:400;color:var(--ink)}
.field textarea{padding:8px 10px;min-height:70px;resize:vertical}
.run-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn.check{border-color:var(--run);color:var(--run);background:var(--surface)}
.field input.need{border-color:var(--danger);background:var(--danger-soft);outline:2px solid var(--danger);outline-offset:1px}
.field .req{color:var(--danger)}
.need-msg{grid-column:1/-1;color:var(--danger);font-weight:600;font-size:13px;margin-top:-4px}
.btn.check:hover{background:var(--run-soft)}
.btn.resume{background:var(--run);border-color:var(--run);color:#fff}
.paused-task{margin:10px 0 2px;font-size:19px;font-weight:700;line-height:1.3;word-break:break-word}
.prev-label{font-size:12px;color:var(--muted);margin-top:14px;font-weight:600}

/* timeline */
.tl{position:relative;height:38px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.tl-work{position:absolute;top:0;bottom:0;background:var(--surface);border-left:1px dashed var(--line);border-right:1px dashed var(--line)}
.tl-seg{position:absolute;top:7px;bottom:7px;border-radius:4px;background:var(--run);min-width:2px}
.tl-seg.ot{background:var(--ot)}
.tl-seg.open{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 6px,transparent 6px 12px)}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--danger)}
.tl-axis{position:relative;height:18px;font-size:11px;color:var(--muted)}
.tl-axis span{position:absolute;transform:translateX(-50%);top:2px}
.tl-legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.tl-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--run)}
.tl-legend i.ot{background:var(--ot)}

/* quick tasks */
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.qbtn{position:relative;min-height:88px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.qbtn:hover{border-color:var(--run)}
.qbtn .qn{font-weight:700;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.qbtn .qs{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qbtn.on{background:var(--run-soft);border-color:var(--run)}
.qbtn.on.is-ot{background:var(--ot-soft);border-color:var(--ot)}
.qbtn .pin{position:absolute;top:8px;right:10px;color:var(--warn);font-size:13px}
.empty{color:var(--muted);padding:14px;border:1.5px dashed var(--line);border-radius:12px;text-align:center}

/* all tasks */
.search{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.search input{flex:1;min-width:220px;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;background:var(--surface);font-size:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;min-height:34px;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tlist{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.tgroup{position:sticky;top:0;background:var(--surface-2);font-size:12px;font-weight:700;color:var(--muted);padding:6px 14px;border-bottom:1px solid var(--line);z-index:1}
.trow{display:flex;align-items:stretch;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.tpick{flex:1;text-align:left;background:transparent;border:0;padding:10px 14px;cursor:pointer;min-height:52px}
.tpick:hover{background:var(--surface-2)}
.tpick b{display:block;font-weight:600}
.tpick small{color:var(--muted);font-size:12px}
.trow.on .tpick{background:var(--run-soft)}
.star{width:52px;border:0;border-left:1px solid var(--line);background:transparent;cursor:pointer;font-size:20px;color:var(--idle)}
.star[aria-pressed="true"]{color:var(--warn)}

/* names */
.names{max-width:1100px;margin:0 auto;padding:36px 20px 60px}
.names-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.names h1{font-size:30px;margin:0 0 4px;letter-spacing:-.5px}
.names p.sub{margin:0;color:var(--muted)}
.big-clock{font-size:44px;font-weight:700;line-height:1;letter-spacing:-1px;text-align:right}
.big-clock small{display:block;font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0;margin-top:6px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.mbtn{min-height:82px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:2px}
.mbtn:hover{border-color:var(--ink)}
.mbtn b{font-size:20px;line-height:1.2}
.mbtn small{color:var(--muted);font-size:13px}
.mbtn .flag{font-size:12px;font-weight:700;color:var(--warn);margin-top:4px}
.mbtn .flag.run{color:var(--run)}
.admin{margin-top:28px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 16px;border:1.5px dashed var(--line);border-radius:14px}
.admin-info{flex:1;min-width:240px;display:flex;flex-direction:column;font-size:13px;color:var(--muted)}
.admin-info b{color:var(--ink);font-size:14px}
.preview-list{margin:4px 0 10px;padding-left:20px;font-size:14px;max-height:160px;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:8px 0 12px}
.kv b{font-variant-numeric:tabular-nums}
.foot{margin-top:18px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.foot .ver{cursor:default;user-select:none}

/* today */
.today-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.today-head select{min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;background:var(--surface);font-size:16px;font-weight:600}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font-size:24px;line-height:1.1}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.actions-row{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:1080px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:14px}
th{background:var(--surface-2);font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{text-align:right}
td input{width:100%;min-height:38px;border:1.5px solid var(--line);border-radius:8px;padding:0 8px;background:var(--surface)}
td input.qty{width:80px}
td select.chk{min-height:38px;border:1.5px solid var(--line);border-radius:8px;padding:0 6px;background:var(--surface)}
.flags{display:flex;gap:4px;flex-wrap:wrap}

/* modal */
#modal-root .scrim{position:fixed;inset:0;z-index:100;background:rgba(10,16,22,.55);display:grid;place-items:center;padding:16px;overflow:auto}
.modal{width:min(560px,100%);background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35);overflow:hidden;border-top:8px solid var(--ink)}
.modal.warn{border-top-color:var(--warn)}
.modal.ot{border-top-color:var(--ot)}
.modal.danger{border-top-color:var(--danger)}
.modal.run{border-top-color:var(--run)}
.modal-b{padding:20px 22px}
.modal h2{margin:0 0 8px;font-size:22px;line-height:1.3}
.modal p{margin:0 0 10px}
.modal .muted{color:var(--muted);font-size:14px}
.modal-a{display:flex;flex-direction:column;gap:8px;padding:0 22px 22px}
.modal-a.row{flex-direction:row;flex-wrap:wrap;justify-content:flex-end}
.modal-a .btn{min-height:52px;font-size:16px}
.modal-a.row .btn{min-height:46px}
.taskbox{background:var(--surface-2);border-radius:12px;padding:12px 14px;margin:10px 0}
.taskbox > b{display:block;font-size:16px}
.taskbox span{color:var(--muted);font-size:13px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.form-grid .full{grid-column:1/-1}
.err{color:var(--danger);font-weight:600;font-size:14px;min-height:20px;margin-top:8px}
.choice{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer}
.steps{margin:10px 0 0;padding-left:20px}

/* toast */
#toast-root{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:90vw}
.toast.warn{background:var(--warn);color:#fff}
.toast.danger{background:var(--danger);color:#fff}

/* blocked */
.blocked{max-width:560px;margin:12vh auto;padding:0 20px;text-align:center}

</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================
   CẤU HÌNH – sửa các biến dưới đây cho phù hợp
   ===================================================================== */

// BẢN CÔNG KHAI: file này KHÔNG chứa thông tin nội bộ (danh sách member, task list, link SharePoint).
// Các thông tin đó nằm trong file config (Template_Config.xlsx) lưu trên SharePoint của team.
// PM/teamlead nạp file config vào tool bằng nút "Update_config" ở màn hình chọn tên (lưu trên trình duyệt của từng máy).
// KHÔNG viết thông tin nội bộ / thông tin khách hàng vào file này.

const WORK_START = "09:00";      // JST
const WORK_END = "16:00";        // JST
const WARN_MINUTES = 120;        // hỏi lại sau bao nhiêu phút chạy liên tục
const REMIND_EXPORT = "15:45";   // JST: bắt đầu hiện banner nhắc xuất file

// Tuỳ chọn thêm
const WORK_DAYS = [1, 2, 3, 4, 5];  // 0=CN, 1=T2 ... 6=T7. Dùng để tô vùng giờ làm trên timeline và nhắc khi không chạy task
const IDLE_REMIND_MINUTES = 15;     // trong giờ làm, không chạy task nào quá X phút thì hiện banner nhắc (không âm báo)
const HEARTBEAT_SECONDS = 60;       // ghi nhận "còn hoạt động" mỗi X giây
const STALE_MINUTES = 3;            // mở lại tool: heartbeat cũ hơn X phút => coi như tool đã bị đóng
const SLEEP_GAP_MINUTES = 5;        // tool đang mở nhưng mất heartbeat quá X phút (máy ngủ) => xử lý như tool bị đóng
const KEEP_DAYS = 30;               // tự xoá dữ liệu cũ hơn X ngày
const QUICK_TASK_COUNT = 12;        // số nút trong "Task của tôi"
const PROMPT_RESOUND_MINUTES = 5;   // popup chưa được trả lời: phát lại âm báo mỗi X phút
const ADMIN_PIN = "";               // mã PIN cho nút "Update_config" (để trống = không cần PIN). Lưu ý: bản công khai thì ai xem code cũng thấy PIN này

/* =====================================================================
   HẾT PHẦN CẤU HÌNH
   ===================================================================== */

const APP_VERSION = '2.1';
const TZ = 9 * 3600000, MIN = 60000, DAY = 86400000;

/* ---------- Thời gian (luôn theo JST, không phụ thuộc múi giờ máy) ---------- */
const now = () => Date.now();
const pad = n => String(n).padStart(2, '0');
function parts(ms) {
  const d = new Date(ms + TZ);
  return { y: d.getUTCFullYear(), mo: d.getUTCMonth() + 1, d: d.getUTCDate(), h: d.getUTCHours(), mi: d.getUTCMinutes(), s: d.getUTCSeconds() };
}
function dayKey(ms) { const p = parts(ms); return `${p.y}-${pad(p.mo)}-${pad(p.d)}`; }
function at(dk, hmStr) {
  const [y, m, d] = dk.split('-').map(Number); const [h, mi] = hmStr.split(':').map(Number);
  return Date.UTC(y, m - 1, d, h, mi) - TZ;
}
function addDays(dk, n) { return dayKey(at(dk, '12:00') + n * DAY); }
function hm(ms) { const p = parts(ms); return pad(p.h) + ':' + pad(p.mi); }
function weekday(dk) { const [y, m, d] = dk.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); }

/* ---------- Lớp lưu trữ: localStorage, tự chuyển sang bộ nhớ tạm nếu không có ---------- */
class Store {

const store = new Store('btt.v1.');

/* ---------- Danh mục ---------- */
const isDash = s => !s || /^[\-－–—ー]$/.test(String(s).trim());

// Danh sách đang dùng = danh sách đã cập nhật qua nút "Cập nhật member/task" (lưu trên máy) nếu có, nếu không thì dùng MEMBERS/TASKS ở trên
let TASK_LIST = [], TASK_BY_KEY = new Map(), DEPTS = [], ALL_MEMBERS = [], MEMBER_LIST = [];
function buildCatalog() {
  const cm = store.get('cfg.members', null), ct = store.get('cfg.tasks', null);
  const mrows = cm && Array.isArray(cm.rows) ? cm.rows : [];
  const trows = ct && Array.isArray(ct.rows) ? ct.rows : [];
  TASK_LIST = []; TASK_BY_KEY = new Map();
  trows.forEach(row => {
    const [dept, l1, l2, l3, dtms] = row.slice(0, 5).map(x => String(x ?? '').trim());
    const name = isDash(l3) ? l2.replace(/^\d+_/, '') : l3;
    const key = [dept, l1, l2, l3, dtms].join('|');
    if (!name || TASK_BY_KEY.has(key)) return;
    const t = { i: TASK_LIST.length, key, dept, l1, l2, l3, dtms, name, kind: String(row[5] ?? '').trim(), path: [l1, l2].filter(x => !isDash(x)).join(' › ') };
    t.search = norm([name, dtms, l1, l2, dept].join(' '));
    TASK_LIST.push(t); TASK_BY_KEY.set(key, t);
  });
  DEPTS = [...new Set(TASK_LIST.map(t => t.dept))];
  ALL_MEMBERS = mrows.map(([name, acc, active]) => ({ name: String(name).trim(), acc: String(acc).trim(), given: String(name).trim().split(/\s+/).pop(), active: active !== false }));
  ALL_MEMBERS.forEach(m => { m.short = ALL_MEMBERS.filter(x => x.given === m.given).length > 1 ? `${m.given} (${m.acc})` : m.given; });
  MEMBER_LIST = ALL_MEMBERS.filter(m => m.active);
}
buildCatalog();
const memberOf = acc => ALL_MEMBERS.find(m => m.acc === acc) || { name: acc, acc, given: acc, short: acc };

/* ---------- Tiện ích ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
function asciiName(s) { return String(s).replace(/đ/g, 'd').replace(/Đ/g, 'D').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]/g, ''); }

/* ---------- Âm báo nhẹ (Web Audio, không cần file) ---------- */
let audioCtx = null;

  try {
    unlockAudio(); if (!audioCtx) return;
    const t0 = audioCtx.currentTime;
    [[784, 0], [1047, 0.22], [784, 0.6], [1047, 0.82]].forEach(([f, d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.12, t0 + d + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.35);
      o.connect(g).connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + 0.4);
    });
  } catch (e) {}
}

/* ---------- Dữ liệu ---------- */
let records = [];

function recsOf(acc, dk) { return records.filter(r => r.member === acc && r.date === dk).sort((a, b) => a.start - b.start); }
function recHash(list) { return hashStr(JSON.stringify(list.map(r => [r.id, r.key, r.start, r.end, r.qty, r.note, !!r.unconfirmed, !!r.edited, r.check || 0, r.doneAt || 0]))); }

  const list = recsOf(acc, dk); const st = ((store.get('exports', {}) || {})[acc] || {})[dk];
  if (!list.length) return { state: 'empty', count: 0 };

}

  const ex = store.get('exports', {}) || {}; ex[acc] = ex[acc] || {};
  ex[acc][dk] = { at: now(), hash: recHash(recsOf(acc, dk)) }; store.set('exports', ex);
}
function purgeOld() {
  const limit = dayKey(now() - KEEP_DAYS * DAY);

  if (records.length !== before) saveRecords();
  const ex = store.get('exports', {}) || {}; let ch = false;
  Object.values(ex).forEach(m => Object.keys(m).forEach(d => { if (d < limit) { delete m[d]; ch = true; } }));
  if (ch) store.set('exports', ex);
}
function favs() { return store.get('favs.' + S.member, []) || []; }

  store.set('favs.' + S.member, f);
}
function quickTasks() {
  const f = favs().filter(k => TASK_BY_KEY.has(k));

  const out = [...f];

}

/* ---------- Modal ---------- */
const modalStack = [];

/* Chọn giờ kết thúc (ngày + giờ, JST) */
function pickEndTime(o) {
  const rec = o.rec; const today = dayKey(now()); const days = [];
  for (let k = rec.date, i = 0; i < 10; i++) { days.push(k); if (k >= today) break; k = addDays(k, 1); }
  const def = o.defaultMs; const defDay = def ? dayKey(def) : rec.date; const defTime = def ? hm(def) : '';
  const body = `
    ${o.intro ? `<p>${o.intro}</p>` : ''}
    <div class="taskbox"><b>${esc(rec.task)}</b><span>Bắt đầu ${fmtDay(rec.date)} lúc ${hm(rec.start)}${rec.end != null ? ` – kết thúc tạm: ${fmtDT(rec.end, rec.date)}` : ''}</span></div>
    <div class="form-grid">
      <label class="field">Ngày kết thúc<select data-f="day">${days.map(d => `<option value="${d}" ${d === defDay ? 'selected' : ''}>${fmtDay(d)}</option>`).join('')}</select></label>
      <label class="field">Giờ kết thúc (JST)<input type="time" data-f="time" value="${defTime}" step="60" autofocus></label>
    </div>
    <div class="err" data-f="err"></div>`;
  const read = root => {
    const d = root.querySelector('[data-f=day]').value, t = root.querySelector('[data-f=time]').value, err = root.querySelector('[data-f=err]');
    if (!t) { err.textContent = 'Hãy nhập giờ kết thúc.'; return null; }
    const ms = at(d, t);
    if (ms <= rec.start) { err.textContent = 'Giờ kết thúc phải sau giờ bắt đầu (' + hm(rec.start) + ').'; return null; }
    if (ms > now() + 30000) { err.textContent = 'Giờ kết thúc không được sau thời điểm hiện tại (' + hm(now()) + ').'; return null; }
    return ms;
  };
  const actions = (o.preActions || []).slice();
  if (o.allowKeep && rec.end != null) actions.push({ label: `Giữ nguyên ${fmtDT(rec.end, rec.date)}`, cls: 'big', onClick: () => { o.onDone(rec.end, true); } });
  actions.push({ label: o.saveLabel || 'Lưu giờ kết thúc', cls: 'primary big', onClick: root => { const ms = read(root); if (ms == null) return false; o.onDone(ms, false); } });
  if (!o.required) actions.push({ label: 'Quay lại', cls: 'ghost', onClick: () => { o.onCancel && o.onCancel(); } });
  return openModal({ title: o.title || 'Đã xong lúc…', tone: o.tone || 'run', body, actions, kind: o.kind || 'endpick' });
}

/* ---------- Hành động chính ---------- */
function finishRecord(rec, endMs, opt = {}) {

    pickEndTime({ rec, title: 'Nhập giờ kết thúc thực tế', tone: 'warn', intro: REASON.midnight, defaultMs: endMs,
      onDone: ms => finishRecord(rec, ms, Object.assign({}, opt, { confirmed: true })) });
    return false;
  }
  rec.end = Math.max(rec.start, endMs);
  if (opt.confirmed && rec.unconfirmed) { rec.unconfirmed = false; rec.reason = ''; }
  delete rec.nextCheckAt; delete rec.ot16Done; rec.updatedAt = now();
  saveRecords(); S.idleSince = now();
  if (S.prompt) closeModal(S.prompt);
  if (opt.then) opt.then(); else render();
  return true;
}
// tổng thời gian đã làm của task đang tạm dừng (cộng dồn các lần Tạm dừng / Tiếp tục)
function pausedTotal(r) { return (r.carry || 0) + (r.end - r.start); }
function startTask(key, carry, skipAsk) {
  const t = TASK_BY_KEY.get(key); if (!t) return;

  if (cur && cur.key === key) { toast('Task này đang chạy'); return; }
  const rt = cur ? null : resumeTarget();
  if (rt && rt.key === key && !skipAsk) { resumeTask(); return; }
  // Đang chạy (hoặc đang tạm dừng) một task mà bấm sang task khác => hỏi task hiện tại đã Done chưa
  if (!skipAsk && (cur || rt)) { askSwitch(cur || rt, !!cur, t, () => startTask(key, carry, true)); return; }
  const go = () => {
    const ts = now(), dk = dayKey(ts), m = memberOf(S.member);
    records.push({ id: uid(), member: S.member, memberName: m.name, date: dk, key, task: t.name, dtms: t.dtms, dept: t.dept, path: t.path,
      start: ts, end: null, qty: '', note: '', unconfirmed: false, reason: '', edited: false,
      nextCheckAt: ts + WARN_MINUTES * MIN, carry: carry || 0, createdAt: ts });
    saveRecords(); render(); toast('Bắt đầu: ' + trunc(t.name, 40));
  };

// Số lượng ticket đã nhập trong lần làm hiện tại (kể cả các đoạn trước khi tạm dừng)
function chainQty(target) {
  const chain = records.filter(r => r.member === S.member && r.key === target.key && r.date === target.date && r.start <= target.start).sort((a, b) => b.start - a.start);
  for (const r of chain) { if (r !== target && r.doneAt) break; if (r.qty !== '' && r.qty != null) return String(r.qty); }
  return '';
}

  const same = records.filter(r => r.member === S.member && r.key === target.key && r.date === target.date && r.end != null && r.start <= target.start).sort((a, b) => b.start - a.start);
  for (const r of same) { if (r !== target && r.doneAt) break; if (!r.check || r === target) r.check = n; delete r.paused; }
  target.check = n; target.doneAt = target.end; target.updatedAt = now();

}

    <p class="muted" style="margin:0 0 10px">Chuyển sang: <b>${esc(nextTask.name)}</b></p>
    <p><b>Task hiện tại đã xong chưa?</b></p>
    <label class="choice"><input type="radio" name="swdone" value="0" checked> Chưa xong – chỉ chuyển task</label>
    <label class="choice"><input type="radio" name="swdone" value="1"> Done check 1</label>
    <label class="choice"><input type="radio" name="swdone" value="2"> Done check 2</label>
    <div class="form-grid"><label class="field"><span>Số lượng ticket <span class="req" data-f="req" hidden>*</span></span><input type="number" min="0" step="1" inputmode="numeric" data-f="qty" value="${esc(curRec.qty)}" placeholder="${had && had !== String(curRec.qty) ? 'Đã nhập trước: ' + esc(had) : ''}"></label></div>
    <div class="err" data-f="err"></div>`;

    actions: [
      { label: 'Chuyển task', cls: 'primary big', onClick: root => {
        const n = +root.querySelector('input[name=swdone]:checked').value;
        const inp = root.querySelector('[data-f=qty]'); const v = inp.value.trim();
        if (n && v === '' && !had) {
          root.querySelector('[data-f=err]').textContent = `Nhập Số lượng ticket (nhập 0 nếu không có ticket) để Done check ${n}.`;
          inp.classList.add('need'); inp.focus(); return false;
        }
        if (v !== '') { curRec.qty = String(Math.max(0, Math.floor(+v) || 0)); curRec.updatedAt = now(); saveRecords(); }
        const after = () => { if (n) applyDone(curRec, n); proceed(); };
        setTimeout(() => { if (running) finishRecord(curRec, now(), { then: after }); else after(); }, 0);
      } },
      { label: 'Ở lại task hiện tại', cls: 'ghost' }
    ],
    onMount: root => {
      const req = root.querySelector('[data-f=req]'), inp = root.querySelector('[data-f=qty]'), err = root.querySelector('[data-f=err]');
      root.querySelectorAll('input[name=swdone]').forEach(r => r.addEventListener('change', () => { const n = +root.querySelector('input[name=swdone]:checked').value; req.hidden = !n; if (!n) { inp.classList.remove('need'); err.textContent = ''; } else if (inp.value === '' && !had) inp.focus(); }));
      inp.addEventListener('input', () => { if (inp.value !== '') { inp.classList.remove('need'); err.textContent = ''; } });
    } });
}
function pauseTask() {
  const cur = runningRec(); if (!cur) return;
  finishRecord(cur, now(), { then: () => { cur.paused = true; saveRecords(); render(); toast('Đã tạm dừng. Bấm "Tiếp tục" để làm tiếp.'); } });
}
// task vừa tạm dừng (bản ghi mới nhất của member hôm nay, dừng bằng nút Tạm dừng, chưa Done)
function resumeTarget() {
  if (!S.member || runningRec()) return null;
  const last = records.filter(r => r.member === S.member).sort((a, b) => b.start - a.start)[0];
  if (!last || last.end == null || !last.paused || last.doneAt || last.date !== dayKey(now()) || !TASK_BY_KEY.has(last.key)) return null;
  return last;
}
function resumeTask() {
  const p = resumeTarget(); if (!p) { toast('Không có task nào đang tạm dừng', 'warn'); return; }
  delete p.paused; saveRecords(); startTask(p.key, pausedTotal(p));
}
// Done check 1/2: kết thúc task (nếu đang chạy) và gắn loại Check cho các bản ghi của lần làm này

  const chain = records.filter(r => r.member === S.member && r.key === target.key && r.date === target.date && r.start <= target.start).sort((a, b) => b.start - a.start);
  let hasQty = false;

  if (!hasQty) {

    if (inp) {

      if (box && !box.querySelector('.need-msg')) box.insertAdjacentHTML('beforeend', `<div class="need-msg">Nhập Số lượng ticket (nhập 0 nếu không có ticket) rồi bấm Done check ${n}.</div>`);
    }

/* đọc file .xlsx (không thư viện) hoặc .csv */

/* nhận diện cột theo tiêu đề */
const hNorm = s => norm(String(s ?? '')).replace(/[\s_]+/g, '');

  for (const sh of sheets) {
    const hi = findHeader(sh.rows, h => h === 'account' || h === 'taikhoan'); if (hi < 0) continue;
    const H = sh.rows[hi].map(hNorm);
    const ia = H.findIndex(h => h === 'account' || h === 'taikhoan');
    let iname = H.findIndex(h => ['member', 'ten', 'hoten', 'hovaten', 'name', 'tenmember', 'fullname'].includes(h));
    if (iname < 0) iname = ia === 0 ? 1 : 0;
    const ist = H.findIndex(h => h.includes('trangthai') || h === 'status');
    const rows = [], errors = [], seen = new Map();
    for (let r = hi + 1; r < sh.rows.length; r++) {
      const row = sh.rows[r] || []; const name = String(row[iname] ?? '').trim(), acc = String(row[ia] ?? '').trim();
      if (!name && !acc) continue;
      if (!name || !acc) { errors.push(`Dòng ${r + 1}: thiếu ${!name ? 'tên' : 'account'}.`); continue; }
      const k = acc.toLowerCase();
      if (seen.has(k)) { errors.push(`Dòng ${r + 1}: account "${acc}" trùng với dòng ${seen.get(k)}.`); continue; }
      seen.set(k, r + 1);

}

    const miss = Object.entries({ dept: '新部署名', l1: 'Level1_業務名', l2: 'Level2_業務名', l3: 'Level3_業務名' }).filter(([k]) => ix[k] < 0).map(([, v]) => v);
    if (miss.length) return { rows: [], errors: [`Sheet "${sh.name}" thiếu cột: ${miss.join(', ')}.`], warnings: [] };
    const rows = [], errors = [], warnings = [], seen = new Set(); let cancel = 0, dup = 0; const noDtms = [], noName = [];
    const g = (row, i) => i < 0 ? '' : String(row[i] ?? '').trim();
    for (let r = hi + 1; r < sh.rows.length; r++) {
      const row = sh.rows[r] || []; const v = { kind: g(row, ix.kind), dept: g(row, ix.dept), l1: g(row, ix.l1), l2: g(row, ix.l2).replace(/\s+/g, ' '), l3: g(row, ix.l3), dtms: g(row, ix.dtms) };
      if (!Object.values(v).some(Boolean)) continue;
      if (v.kind.includes('キャンセル')) { cancel++; continue; }
      if (!v.dtms) { noDtms.push(r + 1); continue; }
      if (isDash(v.l3) && isDash(v.l2)) { noName.push(r + 1); continue; }
      const key = [v.dept, v.l1, v.l2, v.l3, v.dtms].join('|');
      if (seen.has(key)) { dup++; continue; } seen.add(key);
      rows.push([v.dept, v.l1, v.l2, v.l3, v.dtms, v.kind]);
    }
    if (cancel) warnings.push(`Bỏ qua ${cancel} dòng "キャンセル".`);
    if (dup) warnings.push(`Bỏ qua ${dup} dòng trùng lặp.`);
    if (noDtms.length) warnings.push(`Bỏ qua ${noDtms.length} dòng thiếu DTMS TASK (dòng ${noDtms.slice(0, 8).join(', ')}${noDtms.length > 8 ? '…' : ''}).`);
    if (noName.length) warnings.push(`Bỏ qua ${noName.length} dòng không có tên task ở Level2/Level3 (dòng ${noName.slice(0, 8).join(', ')}).`);
    if (!rows.length) errors.push(`Sheet "${sh.name}" không có task hợp lệ nào.`);
    return { sheet: sh.name, rows, errors, warnings };
  }
  return { missing: true, rows: [], errors: ['Không tìm thấy cột "DTMS TASK" trong file. Hãy dùng file template của tool.'], warnings: [] };
}

/* đọc sheet "Cài đặt" */
function parseSettingsSheets(sheets) {
  const out = { found: false, sharepointUrl: '', version: '', errors: [], warnings: [] };
  for (const sh of sheets) {
    sh.rows.forEach(row => {
      const k = hNorm(row && row[0]); const v = String((row && row[1]) ?? '').trim();
      if (!k || k.length > 40) return;
      if (k.includes('sharepoint')) { out.found = true; out.sharepointUrl = v; }
      else if (k.includes('phienban') || k.includes('version')) { out.found = true; out.version = v; }
    });
    if (out.found) break;
  }
  if (out.found && out.sharepointUrl && !/^https:\/\//i.test(out.sharepointUrl)) out.errors.push('Link thư mục SharePoint phải bắt đầu bằng https://');
  if (out.found && !out.sharepointUrl) out.warnings.push('Sheet Cài đặt chưa có Link thư mục SharePoint – nút "Mở thư mục SharePoint" sẽ không dùng được.');
  return out;
}

function timelineHtml() {
  const t = now(); const today = dayKey(t);
  const list = records.filter(r => r.member === S.member && (r.date === today || (r.end ?? t) > at(today, '00:00')) && r.start < at(today, '24:00'));
  let h0 = 7, h1 = 20;
  list.forEach(r => { const s = Math.max(r.start, at(today, '00:00')), e = Math.min(r.end ?? t, at(today, '24:00')); h0 = Math.min(h0, Math.floor((s - at(today, '00:00')) / 3600000)); h1 = Math.max(h1, Math.ceil((e - at(today, '00:00')) / 3600000)); });
  h1 = Math.min(24, Math.max(h1, h0 + 4));
  const base = at(today, '00:00'), A = base + h0 * 3600000, B = base + h1 * 3600000, W = B - A;
  const pc = ms => ((Math.min(Math.max(ms, A), B) - A) / W * 100).toFixed(2);
  let segs = '';
  if (isWorkday(today)) { const ws = at(today, WORK_START), we = at(today, WORK_END); segs += `<div class="tl-work" style="left:${pc(ws)}%;width:${(pc(we) - pc(ws)).toFixed(2)}%"></div>`; }
  list.forEach(r => {
    const s = Math.max(r.start, A), e = Math.min(r.end ?? t, B); if (e <= s) return;
    segs += `<div class="tl-seg ${r.end == null ? 'open' : ''}" style="left:${pc(s)}%;width:${(pc(e) - pc(s)).toFixed(2)}%" title="${esc(r.task)} ${hm(r.start)}–${r.end ? hm(r.end) : 'đang chạy'}"></div>`;
  });
  if (t >= A && t <= B) segs += `<div class="tl-now" style="left:${pc(t)}%" title="Bây giờ"></div>`;
  let axis = ''; const step = (h1 - h0) > 12 ? 3 : 2;
  for (let h = h0; h <= h1; h += step) axis += `<span style="left:${((h - h0) / (h1 - h0) * 100).toFixed(2)}%">${pad(h)}</span>`;
  return `<div class="tl" role="img" aria-label="Các khoảng thời gian đã ghi hôm nay">${segs}</div><div class="tl-axis num">${axis}</div>
    <div class="tl-legend"><span><i></i>Trong giờ ${WORK_START}–${WORK_END}</span><span>Khoảng trống = không chạy task</span></div>`;
}

    const m = minutesOf(r);
    return `<tr>
      <td><b>${esc(r.task)}</b><br><small class="muted" style="color:var(--muted)">${esc(r.dtms || '')}</small></td>
      <td class="num">${hm(r.start)}</td>
      <td class="num">${r.end == null ? '<span class="tag ok">đang chạy</span>' : fmtDT(r.end, r.date)}</td>
      <td class="n num">${m.total}</td>
      <td><select class="chk" data-edit="check" data-id="${r.id}" aria-label="Loại check"><option value="" ${!r.check ? 'selected' : ''}>—</option><option value="1" ${r.check === 1 ? 'selected' : ''}>Check 1</option><option value="2" ${r.check === 2 ? 'selected' : ''}>Check 2</option></select></td>
      <td><input class="qty" type="number" min="0" step="1" inputmode="numeric" data-edit="qty" data-id="${r.id}" value="${esc(r.qty)}" aria-label="Số lượng"></td>
      <td><input type="text" data-edit="note" data-id="${r.id}" value="${esc(r.note)}" aria-label="Ghi chú"></td>
      <td><div class="flags">${r.doneAt ? `<span class="tag ok">Done C${r.check} ${hm(r.doneAt)}</span>` : ''}${r.paused && !r.doneAt ? '<span class="tag">Tạm dừng</span>' : ''}${r.unconfirmed ? '<span class="tag danger">Chưa xác nhận</span>' : ''}${r.edited ? '<span class="tag warn">Đã chỉnh sửa</span>' : ''}</div></td>
      <td style="white-space:nowrap">${r.unconfirmed && r.end != null ? `<button class="btn" data-act="confirm" data-id="${r.id}">Xác nhận</button> ` : ''}<button class="btn" data-act="edit" data-id="${r.id}">Sửa</button></td>
    </tr>`;
  }).join('');
  return `<div class="wrap">
    <div class="today-head">
      <select id="daysel" aria-label="Chọn ngày">${dayOptions().map(d => `<option value="${d}" ${d === dk ? 'selected' : ''}>${d === today ? 'Hôm nay – ' : ''}${fmtDay(d)}</option>`).join('')}</select>
      <div class="stats num"><div class="stat"><b>${tot.total}</b><span>Tổng phút</span></div></div>
      <div>${stTag}</div>
    </div>
    <div class="actions-row">
      <button class="btn primary" data-act="export" ${list.length ? '' : 'disabled'}>Xuất Excel ngày này</button>
      <button class="btn" data-act="add">+ Thêm bản ghi bị quên</button>
      <button class="btn ghost" data-act="sp">Mở thư mục SharePoint</button>
      <span style="flex:1"></span>
      <button class="btn danger-ghost" data-act="delete">Xoá dữ liệu…</button>
    </div>
    ${list.length ? `<div class="tbl-wrap"><table><thead><tr><th>Task</th><th>Bắt đầu</th><th>Kết thúc</th><th>Phút</th><th>Check</th><th>Số lượng</th><th>Ghi chú</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
      : '<div class="empty">Chưa có bản ghi nào trong ngày này. Nếu bạn quên bấm giờ, dùng "+ Thêm bản ghi bị quên".</div>'}
    <p class="muted" style="color:var(--muted);font-size:13px;margin-top:10px">Sửa task hoặc giờ sẽ gắn cờ "Đã chỉnh sửa". Số lượng và ghi chú có thể nhập bất cứ lúc nào.</p>
  </div>`;
}

/* form sửa / thêm bản ghi */
function recordForm(r, isNew) {
  const dk = r ? r.date : (S.viewDay || dayKey(now()));
  const days = [addDays(dk, -1), dk, addDays(dk, 1)].filter(d => d <= dayKey(now()));
  let sMs, eMs;
  if (r) { sMs = r.start; eMs = r.end; }
  else {
    const prev = recsOf(S.member, dk).filter(x => x.end != null).pop();
    sMs = prev ? prev.end : at(dk, WORK_START); eMs = Math.min(sMs + 30 * MIN, now());
    if (eMs <= sMs) { sMs = now() - 30 * MIN; eMs = now(); }
  }
  const curKey = r ? r.key : '';
  const opts = DEPTS.map(d => `<optgroup label="${esc(d)}">${TASK_LIST.filter(t => t.dept === d).map(t => `<option value="${t.i}" ${t.key === curKey ? 'selected' : ''}>${esc(t.name)}${t.dtms !== t.name ? ' — ' + esc(t.dtms) : ''}</option>`).join('')}</optgroup>`).join('');
  const missing = r && !TASK_BY_KEY.has(r.key) ? `<option value="__keep" selected>${esc(r.task)} (không còn trong danh sách)</option>` : '';
  const dSel = (f, v) => `<select data-f="${f}">${days.map(d => `<option value="${d}" ${d === dayKey(v) ? 'selected' : ''}>${fmtDay(d)}</option>`).join('')}</select>`;
  const running = r && r.end == null;
  const body = `<div class="form-grid">
      <label class="field full">Lọc task<input type="search" data-f="tq" placeholder="Gõ để lọc danh sách…"></label>
      <label class="field full">Task<select data-f="task">${isNew ? '<option value="">— Chọn task —</option>' : ''}${missing}${opts}</select></label>
      <label class="field">Ngày bắt đầu${dSel('sd', sMs)}</label><label class="field">Giờ bắt đầu<input type="time" data-f="st" value="${hm(sMs)}"></label>
      ${running ? '<p class="full muted" style="margin:0">Task đang chạy – giờ kết thúc sẽ ghi khi bạn dừng task.</p>' : `<label class="field">Ngày kết thúc${dSel('ed', eMs)}</label><label class="field">Giờ kết thúc<input type="time" data-f="et" value="${hm(eMs)}"></label>`}
      <label class="field">Số lượng ticket<input type="number" min="0" step="1" data-f="qty" value="${esc(r ? r.qty : '')}"></label>
      <label class="field">Ghi chú<input type="text" data-f="note" value="${esc(r ? r.note : '')}"></label>
      <label class="field">Loại check<select data-f="check"><option value="">—</option><option value="1" ${r && r.check === 1 ? 'selected' : ''}>Check 1</option><option value="2" ${r && r.check === 2 ? 'selected' : ''}>Check 2</option></select></label>
    </div><div class="err" data-f="err"></div>`;
  const read = root => {
    const g = f => root.querySelector(`[data-f=${f}]`); const err = g('err');
    const tv = g('task').value; if (!tv) { err.textContent = 'Hãy chọn task.'; return null; }
    const task = tv === '__keep' ? null : TASK_LIST[+tv];
    const s = at(g('sd').value, g('st').value || '00:00');
    const e = running ? null : at(g('ed').value, g('et').value || '00:00');
    if (!g('st').value || (!running && !g('et').value)) { err.textContent = 'Hãy nhập đủ giờ.'; return null; }
    if (!running && e <= s) { err.textContent = 'Giờ kết thúc phải sau giờ bắt đầu.'; return null; }
    if ((e ?? s) > now() + 30000) { err.textContent = 'Không được nhập giờ trong tương lai.'; return null; }
    const clash = records.find(x => x.member === S.member && (!r || x.id !== r.id) && s < (x.end ?? now()) && (e ?? now()) > x.start);
    if (clash) { err.textContent = `Trùng giờ với "${trunc(clash.task, 30)}" (${hm(clash.start)}–${clash.end ? hm(clash.end) : 'đang chạy'}). Hãy chỉnh lại.`; return null; }
    const q = g('qty').value.trim();
    return { task, s, e, qty: q === '' ? '' : String(Math.max(0, Math.floor(+q) || 0)), note: g('note').value, check: g('check').value ? +g('check').value : null };
  };
  const actions = [];
  actions.push({ label: 'Huỷ', cls: 'ghost' });
  if (!isNew && !running) actions.push({ label: 'Xoá bản ghi', cls: 'danger-ghost', onClick: () => { setTimeout(() => confirmDeleteRecord(r), 0); } });
  actions.push({ label: isNew ? 'Thêm bản ghi' : 'Lưu', cls: 'primary', onClick: root => {
    const v = read(root); if (!v) return false;
    if (isNew) {
      const m = memberOf(S.member);
      records.push({ id: uid(), member: S.member, memberName: m.name, date: dayKey(v.s), key: v.task.key, task: v.task.name, dtms: v.task.dtms, dept: v.task.dept, path: v.task.path,
        start: v.s, end: v.e, qty: v.qty, note: v.note, check: v.check, unconfirmed: false, reason: '', edited: true, manual: true, createdAt: now() });
      S.viewDay = dayKey(v.s);
    } else {
      const changed = (v.task && v.task.key !== r.key) || v.s !== r.start || (!running && v.e !== r.end);
      if (v.task) Object.assign(r, { key: v.task.key, task: v.task.name, dtms: v.task.dtms, dept: v.task.dept, path: v.task.path });
      r.start = v.s; r.date = dayKey(v.s); if (!running) r.end = v.e;
      r.qty = v.qty; r.note = v.note; r.check = v.check; if (!r.check) delete r.doneAt;
      if (changed) { r.edited = true; if (r.end != null) { r.unconfirmed = false; r.reason = ''; } }
      r.updatedAt = now();
    }
    saveRecords(); warnIfExported(isNew ? dayKey(v.s) : r.date); render();
  } });
  openModal({ title: isNew ? 'Thêm bản ghi bị quên' : 'Sửa bản ghi', tone: 'run', body, actions, row: true,
    onMount: root => {
      const tq = root.querySelector('[data-f=tq]'), sel = root.querySelector('[data-f=task]');
      tq.addEventListener('input', () => { const w = norm(tq.value).split(/\s+/).filter(Boolean); sel.querySelectorAll('option').forEach(o => { if (!o.value || o.value === '__keep') return; const t = TASK_LIST[+o.value]; o.hidden = !w.every(x => t.search.includes(x)); }); });
    } });
}
function confirmDeleteRecord(r) {
  openModal({ title: 'Xoá bản ghi này?', tone: 'danger', row: true,
    body: `<div class="taskbox"><b>${esc(r.task)}</b><span>${fmtDay(r.date)} ${hm(r.start)}–${r.end ? hm(r.end) : ''}</span></div><p>Bản ghi sẽ bị xoá vĩnh viễn khỏi máy này.</p>`,
    actions: [{ label: 'Huỷ', cls: 'ghost' }, { label: 'Xoá vĩnh viễn', cls: 'danger', onClick: () => { records = records.filter(x => x.id !== r.id); saveRecords(); warnIfExported(r.date); render(); toast('Đã xoá bản ghi'); } }] });
}
function warnIfExported(dk) { const st = exportStatus(S.member, dk); if (st.state === 'stale') toast('Ngày này đã xuất file trước đó – hãy xuất lại và upload file mới', 'warn'); }
function deleteDataFlow() {
  const dk = S.viewDay || dayKey(now());
  const nDay = recsOf(S.member, dk).filter(r => r.end != null).length, nAll = records.filter(r => r.member === S.member && r.end != null).length;
  openModal({ title: 'Xoá dữ liệu của bạn', tone: 'danger', row: true,
    body: `<p>Chỉ xoá dữ liệu của <b>${esc(memberOf(S.member).name)}</b> trên máy này. Task đang chạy không bị xoá.</p>
      <label class="choice"><input type="radio" name="dscope" value="day" checked> Ngày ${fmtDay(dk)} (${nDay} bản ghi)</label>
      <label class="choice"><input type="radio" name="dscope" value="all"> Toàn bộ dữ liệu của tôi (${nAll} bản ghi)</label>
      <p class="muted">Dữ liệu cũ hơn ${KEEP_DAYS} ngày được tự động xoá.</p>`,
    actions: [{ label: 'Huỷ', cls: 'ghost' }, { label: 'Tiếp tục', cls: 'danger', onClick: root => {
      const scope = root.querySelector('input[name=dscope]:checked').value; const n = scope === 'day' ? nDay : nAll;
      if (!n) { toast('Không có bản ghi nào để xoá'); return; }
      setTimeout(() => openModal({ title: `Xoá vĩnh viễn ${n} bản ghi?`, tone: 'danger', row: true,
        body: `<p>Thao tác này không hoàn tác được. Nếu chưa upload file Excel lên SharePoint, dữ liệu sẽ mất hẳn.</p>`,
        actions: [{ label: 'Huỷ', cls: 'ghost' }, { label: 'Xoá vĩnh viễn', cls: 'danger', onClick: () => {
          records = records.filter(r => !(r.member === S.member && r.end != null && (scope === 'all' || r.date === dk)));
          saveRecords(); render(); toast(`Đã xoá ${n} bản ghi`);
        } }] }), 0);
    } }] });
}

/* cập nhật phần động mỗi giây */
function updateTitle(t) {
  let title;
  if (!S.member) title = 'Bấm giờ task – chọn tên';
  else {
    const m = memberOf(S.member).short; const r = runningRec();
    const rt = r ? null : resumeTarget();
    title = r ? `▶ ${m} | ${trunc(r.dtms || r.task, 18)} ${dur(t - r.start + (r.carry || 0))}`
      : rt ? `⏸ ${m} | ${trunc(rt.dtms || rt.task, 18)} ${dur(pausedTotal(rt))} | Tạm dừng` : `⏸ ${m} | Chưa chạy task`;
  }
  if (S.prompt) { S.flip = !S.flip; if (S.flip) title = '⚠ Kiểm tra task! ' + title; }
  if (document.title !== title) document.title = title;
}
function bannersHtml(t) {
  if (!S.member) return '';
  const out = []; const r = runningRec(); const today = dayKey(t);
  if (r && r.unconfirmed) out.push(`<div class="banner danger"><p>Task đang chạy đã qua 00:00. Khi dừng, bạn sẽ cần nhập giờ kết thúc thực tế.</p></div>`);
  if (!r && inWork(t) && S.idleSince && t - S.idleSince >= IDLE_REMIND_MINUTES * MIN)
    out.push(`<div class="banner info"><p>Bạn không chạy task nào trong ${Math.floor((t - S.idleSince) / MIN)} phút. Nếu đang làm việc, hãy bấm vào task.</p></div>`);
  if (t >= at(today, REMIND_EXPORT)) {
    const st = exportStatus(S.member, today);
    if (st.state === 'stale') out.push(`<div class="banner danger"><p>Dữ liệu hôm nay đã thay đổi sau lần xuất lúc ${hm(st.at)}. Hãy xuất lại và upload file mới lên SharePoint.</p><button class="btn" data-act="exporttoday">Xuất lại Excel</button></div>`);
  }
  return out.join('');
}
function updateLive(t) {
  document.querySelectorAll('[data-live=clock]').forEach(e => { const v = hm(t); if (e.textContent !== v) e.textContent = v; });
  const r = S.member ? runningRec() : null;
  if (r) {
    const el = t - r.start + (r.carry || 0); const s = Math.floor(el / 1000) % 60;
    const ee = document.querySelector('[data-live=elapsed]'); if (ee) ee.innerHTML = `${dur(el)}<small>:${pad(s)}</small>`;
    document.querySelectorAll('[data-live=el]').forEach(e => e.textContent = dur(el));
    const nx = document.querySelector('[data-live=next]');
    if (nx) { const due = r.nextCheckAt; nx.textContent = due ? `Hỏi lại lúc ${hm(due)}` : ''; }
  }
  const b = $('#banners'); if (b) { const h = bannersHtml(t); if (h !== S.lastBanners) { S.lastBanners = h; b.innerHTML = h; } }
  const tl = document.querySelector('[data-live=timeline]'); if (tl && (t - S.lastTL > 20000 || !tl.innerHTML)) { S.lastTL = t; tl.innerHTML = timelineHtml(); }
  updateTitle(t);
}

/* ---------- Vòng lặp mỗi giây ---------- */
function tick() {
  if (S.blocked) return;
  const t = now();
  // Tool bị gián đoạn khi đang mở (máy ngủ, tab bị trình duyệt cho "ngủ"): KHÔNG dừng task, chỉ hỏi member
  if (S.lastHB && t - S.lastHB > SLEEP_GAP_MINUTES * MIN) {
    const last = S.lastHB; writeHB(t);
    const r = S.member ? runningRec() : null;
    if (r) { if (S.prompt) closeModal(S.prompt); showGapPrompt(r, last, t); }
  }
  if (!S.lastHB || t - S.lastHB >= HEARTBEAT_SECONDS * 1000) writeHB(t);
  const dk = dayKey(t);
  if (dk !== S.lastDay) { const first = !S.lastDay; S.lastDay = dk; if (!first) { flagMidnight(); render(); } }
  checkPrompts(t);
  if (S.prompt && t - S.promptSoundAt >= PROMPT_RESOUND_MINUTES * MIN) { S.promptSoundAt = t; chime(); }
  updateLive(t);
}

/* ---------- Sự kiện ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-member],[data-start],[data-fav],[data-nav],[data-act],[data-dept]');
  if (!el || S.blocked || !$('#app').contains(el)) return;
  unlockAudio();
  if (el.dataset.member) return selectMember(el.dataset.member);
  if (el.dataset.start != null) { const t = TASK_LIST[+el.dataset.start]; if (t) startTask(t.key); return; }
  if (el.dataset.fav != null) { const t = TASK_LIST[+el.dataset.fav]; if (t) { toggleFav(t.key); const y = $('#tlist').scrollTop; render(); $('#tlist').scrollTop = y; } return; }
  if (el.dataset.dept) { S.dept = el.dataset.dept; document.querySelectorAll('[data-dept]').forEach(c => c.setAttribute('aria-pressed', c.dataset.dept === S.dept)); renderTaskList(); return; }
  if (el.dataset.nav) { S.screen = el.dataset.nav; render(); return; }
  const a = el.dataset.act; const id = el.dataset.id;
  if (a === 'pause') pauseTask();
  else if (a === 'resume') resumeTask();
  else if (a === 'done1') doneCheck(1);
  else if (a === 'done2') doneCheck(2);
  else if (a === 'endday') endDay();
  else if (a === 'switch') switchPerson();
  else if (a === 'export') exportDay(S.viewDay || dayKey(now()));
  else if (a === 'exporttoday') exportDay(dayKey(now()));
  else if (a === 'sp') openSP();
  else if (a === 'add') recordForm(null, true);
  else if (a === 'edit') { const r = records.find(x => x.id === id); if (r) recordForm(r, false); }
  else if (a === 'confirm') { const r = records.find(x => x.id === id); if (r) pickEndTime({ rec: r, allowKeep: true, tone: 'warn', title: 'Xác nhận giờ kết thúc', intro: REASON[r.reason] || '', defaultMs: r.end,
      onDone: (ms, kept) => { if (!kept) { if (Math.abs(ms - r.end) >= MIN) r.edited = true; r.end = ms; } r.unconfirmed = false; r.reason = ''; saveRecords(); warnIfExported(r.date); render(); } }); }
  else if (a === 'delete') deleteDataFlow();
  else if (a === 'upd-config') withPin(openConfigAdmin);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'taskq') { S.query = t.value; renderTaskList(); return; }
  if (t.dataset && t.dataset.edit) {
    const r = records.find(x => x.id === t.dataset.id); if (!r) return;
    if (t.dataset.edit === 'qty') {
      const v = t.value.trim(); r.qty = v === '' ? '' : String(Math.max(0, Math.floor(+v) || 0));
      if (r.qty !== '') { t.classList.remove('need'); const msg = t.closest('.fields') && t.closest('.fields').querySelector('.need-msg'); if (msg) msg.remove(); }
    }
    else if (t.dataset.edit === 'check') { r.check = t.value ? +t.value : null; if (!r.check) delete r.doneAt; }
    else r.note = t.value;
    r.updatedAt = now(); saveRecords();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'daysel') { S.viewDay = t.value; render(); }
  if (t.dataset && t.dataset.edit) { const r = records.find(x => x.id === t.dataset.id); if (r) warnIfExported(r.date); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#tlist') && document.activeElement && document.activeElement.id === 'taskq' && S.query) { S.query = ''; document.activeElement.value = ''; renderTaskList(); }
});
window.addEventListener('pagehide', () => {
  if (S.blocked) return;
  writeHB(now());
  if (store.mode === 'local') { const l = store.get('lock', null); if (l && l.id === TAB_ID) store.del('lock'); }
});
document.addEventListener('visibilitychange', () => { if (!S.blocked) { if (document.visibilityState === 'hidden') writeHB(now()); else tick(); } });

/* ---------- Khởi động ---------- */
function boot(force) {
  store.del('testOffset'); // dọn giờ ảo còn sót từ bản cũ
  loadRecords(); buildCatalog();
  if (!acquireLock(force)) { showBlocked(false); return; }
  S.blocked = false;
  purgeOld();
  recoverOnOpen();
  S.lastDay = dayKey(now()); writeHB(now());
  S.member = null; S.screen = 'names';
  render();
}
setInterval(tick, 1000);
setInterval(() => {
  if (store.mode !== 'local' || S.blocked) return;
  const l = store.get('lock', null);
  if (l && l.id !== TAB_ID) { showBlocked(true); return; }
  store.set('lock', { id: TAB_ID, at: Date.now() });
}, 4000);
boot();
</script>
</body>
</html>
